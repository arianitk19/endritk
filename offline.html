<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Endrit Krasniqi</title>
  <meta name="theme-color" content="#F4F1EA" />
  <style>
    :root{ --paper:#F4F1EA; --ink:#24221E; --muted:#6F6B62; --accent:#A65A46; --line:rgba(26,26,24,0.16); }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      font-family:"Archivo","Helvetica Neue",Arial,sans-serif; background:var(--paper); color:var(--ink);
      display:grid; place-items:center; padding:32px; text-align:center;
    }
    .wrap{ max-width:440px; }
    .mark{ width:44px;height:44px;border:1px solid var(--line);margin:0 auto 34px;display:grid;place-items:center;position:relative; }
    .mark::before{ content:"";width:12px;height:12px;border-top:1px solid var(--ink);border-right:1px solid var(--ink);transform:rotate(45deg) translate(-1px,1px); }
    .idx{ font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px;display:block; }
    h1{ font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.05;margin-bottom:16px; }
    p{ color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:30px; }
    a{
      display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
      font-weight:600;color:var(--ink);border:1px solid var(--ink);padding:14px 22px;text-decoration:none;
      transition:background .4s ease,color .4s ease;
    }
    a:hover{ background:var(--ink);color:var(--paper); }
    .name{ margin-top:40px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted); }
    .name b{ color:var(--ink); }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="mark" aria-hidden="true"></span>
    <span class="idx">Offline</span>
    <h1>Keine Verbindung.</h1>
    <p>Diese Seite ist derzeit offline nicht verfügbar. Bitte prüfen Sie Ihre Internetverbindung und versuchen Sie es erneut.</p>
    <a href="./index.html">Erneut versuchen →</a>
    <div class="name"><b>ENDRIT</b> KRASNIQI</div>
  </div>
</body>
</html>
